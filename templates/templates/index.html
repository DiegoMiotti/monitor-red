<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor Global - Full Enterprise</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 15px; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .logo { cursor: pointer; text-decoration: none; color: inherit; font-size: 1.5em; font-weight: bold; }
        .nav-btns { display: flex; gap: 10px; }
        .nav-btns button { background: #21262d; border: 1px solid #30363d; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .nav-btns button.active { border-color: #58a6ff; background: #30363d; }

        /* Contenedores de Vistas */
        #global-view-container { display: flex; gap: 15px; width: 100%; align-items: flex-start; }
        .full-view-container { width: 100%; display: none; flex-direction: column; gap: 20px; }
        
        /* Grid y Tarjetas */
        .grid { flex: 1; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 220px; padding: 12px; box-sizing: border-box; }
        .card.error { border-color: #f85149; }
        .card-title { font-weight: bold; color: #58a6ff; margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 0.95em; }
        .card-title span { cursor: pointer; }
        .card-title span:hover { text-decoration: underline; color: white; }
        .equipo-row { display: flex; justify-content: space-between; font-size: 0.85em; padding: 5px; border-radius: 4px; cursor: pointer; }
        .equipo-row:hover { background: #30363d; }

        /* Sidebar Histórico PRO */
        .sidebar { width: 32%; min-width: 400px; background: #161b22; padding: 20px; border-radius: 10px; border: 1px solid #30363d; position: sticky; top: 15px; }
        #hist-info { margin-bottom: 15px; padding: 10px; background: #0d1117; border-radius: 5px; font-size: 0.9em; border-left: 4px solid #58a6ff; min-height: 40px; }
        .range-buttons { display: flex; gap: 5px; margin-bottom: 15px; }
        .range-buttons button { background: #21262d; border: 1px solid #30363d; color: white; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 0.8em; flex: 1; }
        .range-buttons button.active { background: #238636; }
        .chart-wrapper { height: 350px; width: 100%; }
        #chart { cursor: grab; }
        #chart:active { cursor: grabbing; }
        .scroll-container { width: 100%; margin-top: 15px; display: flex; align-items: center; gap: 10px; background: #0d1117; padding: 8px 12px; border-radius: 20px; }
        input[type=range] { flex-grow: 1; accent-color: #58a6ff; cursor: pointer; }

        /* Vista Live Individual */
        .mini-card { background: #0d1117; border: 1px solid #333; border-radius: 6px; padding: 8px; min-width: 140px; flex: 1; transition: 0.3s; }
        .mini-card.paused { opacity: 0.3; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 2s infinite; }

        /* Vista Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; }
        .chart-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; height: 400px; box-sizing: border-box; }

        .breadcrumb { margin-bottom: 15px; font-size: 0.9em; color: #8b949e; }
        .breadcrumb span { cursor: pointer; color: #58a6ff; font-weight: bold; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="header">
        <a href="javascript:location.reload()" class="logo">Monitor <span style="color:#3fb950">●</span></a>
        <div class="nav-btns">
            <button id="btn-bases" class="active" onclick="setView('bases')">Por Bases</button>
            <button id="btn-tipos" onclick="setView('tipos')">Por Categorías</button>
            <button id="btn-stats" onclick="setView('stats')">📈 Estadísticas</button>
        </div>
        <p id="clock" style="color: #8b949e; font-size: 0.9em;"></p>
    </div>

    <div id="global-view-container">
        <div id="grid-container" class="grid"></div>
        <div class="sidebar">
            <h3 style="margin-top:0">Panel Histórico</h3>
            <div id="hist-info">Seleccioná un equipo.</div>
            <div id="controls" style="display:none;">
                <div class="range-buttons">
                    <button onclick="changeRange(3, this)">3h</button>
                    <button onclick="changeRange(24, this)" class="active">24h</button>
                    <button onclick="changeRange(48, this)">48h</button>
                    <button onclick="changeRange(168, this)">7d</button>
                </div>
            </div>
            <div class="chart-wrapper"><canvas id="chart"></canvas></div>
            <div id="scroll-wrapper" style="display:none;" class="scroll-container">
                <input type="range" id="chartScroll" min="0" max="100" value="100" oninput="scrollChart(this.value)">
            </div>
        </div>
    </div>

    <div id="base-detail-view" class="full-view-container">
        <div class="breadcrumb"><span onclick="closeBaseDetail()">⬅ Volver</span> / Detalle en vivo: <b id="lbl-base-activa"></b></div>
        <div id="base-cards-mini" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;"></div>
        <div class="chart-card" style="height:500px;"><canvas id="liveChart"></canvas></div>
    </div>

    <div id="stats-view" class="full-view-container">
        <div class="breadcrumb"><span>Análisis de Rendimiento Histórico</span></div>
        <div class="stats-grid">
            <div class="chart-card">
                <div class="card-title">Disponibilidad (Histórico)</div>
                <div style="height:300px;"><canvas id="statsPie"></canvas></div>
            </div>
            <div class="chart-card">
                <div class="card-title">Top Inestables (Cortes)</div>
                <div style="height:300px;"><canvas id="statsInestables"></canvas></div>
            </div>
            <div class="chart-card" style="grid-column: span 2;">
                <div class="card-title">Latencia Promedio (ms)</div>
                <div style="height:300px;"><canvas id="statsLentos"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        let myChart = null, liveChart = null, sPie = null, sBar1 = null, sBar2 = null;
        let currentView = 'bases', activeBase = null, currentCategory = null;
        let rawData = [], liveDataStore = {}, currentIp = null, currentHours = 24;
        let globalTimer = null, liveTimer = null, pausedTypes = {};
        const COLORS = {'Forti':'#58a6ff','DVR':'#f0883e','TGO':'#3fb950','Calle':'#d299ff','Comedor':'#f85149','Jaula':'#e3b341','Terceros':'#8b949e'};

        async function refreshGlobal() {
            if (activeBase || currentView === 'stats') return;
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                rawData = data.equipos;
                document.getElementById('clock').innerText = 'Sync: ' + data.hora;
                render();
            } catch(e) {}
        }

        function setView(view) {
            currentView = view; activeBase = null; currentCategory = null;
            document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + (view === 'stats' ? 'stats' : (view === 'tipos' ? 'tipos' : 'bases'))).classList.add('active');
            
            document.getElementById('global-view-container').style.display = (view === 'bases' || view === 'tipos') ? 'flex' : 'none';
            document.getElementById('base-detail-view').style.display = 'none';
            document.getElementById('stats-view').style.display = (view === 'stats' ? 'flex' : 'none');

            if (view === 'stats') renderStats(); else refreshGlobal();
        }

        // --- HISTORIAL LATERAL PRO ---
        async function initHistory(ip, base, tipo) {
            currentIp = ip;
            document.getElementById('controls').style.display = 'block';
            document.getElementById('scroll-wrapper').style.display = 'flex';
            document.getElementById('hist-info').innerHTML = `<b>${base}</b> - ${tipo}<br><small>${ip}</small>`;
            loadHistory();
        }

        async function loadHistory() {
            if (!currentIp) return;
            const res = await fetch(`/api/history?ip=${currentIp}&horas=${currentHours}`);
            const data = await res.json();
            if (myChart) myChart.destroy();
            myChart = new Chart(document.getElementById('chart'), {
                type: 'line',
                data: { labels: data.labels, datasets: [{ label: 'ms', data: data.values, borderColor: '#58a6ff', borderWidth: 1.5, fill: true, backgroundColor: 'rgba(88, 166, 255, 0.1)', pointRadius: 0 }] },
                options: { 
                    responsive: true, maintainAspectRatio: false, animation: false,
                    plugins: { zoom: { pan: { enabled: true, mode: 'x', onPan: syncSlider }, zoom: { wheel: { enabled: true }, mode: 'x', onZoom: syncSlider } } },
                    scales: { x: { ticks: { autoSkip: true, maxTicksLimit: 8 } }, y: { beginAtZero: true } }
                }
            });
            document.getElementById('chartScroll').value = 100;
        }

        function syncSlider({chart}) {
            const total = chart.data.labels.length, current = chart.scales.x.max;
            document.getElementById('chartScroll').value = (current / (total - 1)) * 100;
        }

        function scrollChart(v) {
            if(!myChart) return;
            const total = myChart.data.labels.length, range = myChart.scales.x.max - myChart.scales.x.min;
            const nMax = (v/100) * (total-1);
            myChart.zoomScale('x', {min: nMax - range, max: nMax}, 'none');
        }

        function changeRange(h, btn) {
            currentHours = h;
            document.querySelectorAll('.range-buttons button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadHistory();
        }

        // --- VISTA LIVE INDIVIDUAL ---
        function openBaseDetail(name) {
            activeBase = name; liveDataStore = {}; pausedTypes = {};
            clearInterval(globalTimer);
            document.getElementById('lbl-base-activa').innerText = name;
            document.getElementById('global-view-container').style.display = 'none';
            document.getElementById('base-detail-view').style.display = 'flex';
            
            rawData.filter(e => e.base === name).forEach(e => {
                liveDataStore[e.tipo] = Array(60).fill({x: '', y: null});
            });

            renderMiniCards();
            if (liveChart) liveChart.destroy();
            initLiveChart();
            liveTimer = setInterval(refreshLive, 1000);
        }

        function closeBaseDetail() {
            clearInterval(liveTimer); activeBase = null;
            setView('bases');
        }

        function initLiveChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            liveChart = new Chart(ctx, {
                type: 'line',
                data: { labels: Array(60).fill(''), datasets: [] },
                options: { 
                    responsive: true, maintainAspectRatio: false, animation: false,
                    scales: { y: { beginAtZero: true, grid: { color: '#333' } }, x: { display: false } },
                    plugins: { legend: { onClick: (e, item) => {
                        const tipo = item.text;
                        pausedTypes[tipo] = !pausedTypes[tipo];
                        updateMiniCardsStatus();
                    }}}
                }
            });
        }

        async function refreshLive() {
            const response = await fetch('/api/status');
            const data = await response.json();
            const filtered = data.equipos.filter(e => e.base === activeBase);
            const now = new Date().toLocaleTimeString();

            filtered.forEach(e => {
                if (!pausedTypes[e.tipo]) {
                    let val = (e.estado === 'UP') ? (Math.random()*15 + 5) : 0;
                    liveDataStore[e.tipo].push({ x: now, y: val });
                } else {
                    liveDataStore[e.tipo].push({ x: now, y: null });
                }
                liveDataStore[e.tipo].shift();
            });

            liveChart.data.labels = liveDataStore[Object.keys(liveDataStore)[0]].map(p => p.x);
            liveChart.data.datasets = Object.keys(liveDataStore).map(tipo => ({
                label: tipo, data: liveDataStore[tipo].map(p => p.y), borderColor: COLORS[tipo], borderWidth: 2, pointRadius: 0, fill: false, hidden: pausedTypes[tipo]
            }));
            liveChart.update('none');
        }

        function renderMiniCards() {
            const container = document.getElementById('base-cards-mini');
            container.innerHTML = '';
            rawData.filter(e => e.base === activeBase).forEach(e => {
                const card = document.createElement('div');
                card.className = 'mini-card'; card.id = 'mini-card-' + e.tipo;
                let dotCol = (e.estado === 'UP') ? '#3fb950' : '#f85149';
                card.innerHTML = `<div style="font-size:0.8em; color:#8b949e">${e.tipo}</div><div style="display:flex; align-items:center;"><span class="status-dot" style="background:${dotCol}"></span><span style="color:${dotCol}">${e.estado}</span></div>`;
                container.appendChild(card);
            });
        }

        function updateMiniCardsStatus() {
            Object.keys(COLORS).forEach(tipo => {
                const card = document.getElementById('mini-card-' + tipo);
                if (card) {
                    if (pausedTypes[tipo]) card.classList.add('paused'); else card.classList.remove('paused');
                }
            });
        }

        // --- ESTADÍSTICAS ---
        async function renderStats() {
            const res = await fetch('/api/stats');
            const data = await res.json();
            if(sPie) sPie.destroy(); if(sBar1) sBar1.destroy(); if(sBar2) sBar2.destroy();

            sPie = new Chart(document.getElementById('statsPie'), {
                type: 'doughnut',
                data: { labels: ['UP', 'DOWN'], datasets: [{ data: data.pie, backgroundColor: ['#3fb950', '#f85149'] }] },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
            });

            sBar1 = new Chart(document.getElementById('statsInestables'), {
                type: 'bar',
                data: { labels: data.inestables.labels, datasets: [{ label: 'Cortes', data: data.inestables.values, backgroundColor: '#f0883e' }] },
                options: { maintainAspectRatio: false, scales: { y: { ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } } }
            });

            sBar2 = new Chart(document.getElementById('statsLentos'), {
                type: 'bar',
                data: { labels: data.lentos.labels, datasets: [{ label: 'Latencia (ms)', data: data.lentos.values, backgroundColor: '#58a6ff' }] },
                options: { 
    indexAxis: 'y', 
    maintainAspectRatio: false, 
    layout: {
        padding: {
            left: 10 // Espacio extra para que el nombre no pegue contra el borde
        }
    },
    scales: { 
        y: { 
            ticks: { 
                color: '#fff', 
                font: { size: 11 }, // Fuente un poco más pequeña para que quepa mejor
                padding: 10 // Distancia entre el texto y el eje
            },
            grid: { display: false } // Limpia el fondo para que destaque el nombre
        }, 
        x: { 
            ticks: { color: '#fff' },
            grid: { color: '#333' }
        } 
    },
    plugins: {
        legend: { display: false } // Quitamos la leyenda "ms" para ganar espacio
    }
}
            });
        }

        // --- RENDERS DASHBOARD ---
        function render() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            if (currentView === 'bases') renderBases(container);
            else if (!currentCategory) renderMenuTipos(container);
            else renderDetalleTipo(container);
        }

        function renderBases(container) {
            const grouped = {};
            rawData.forEach(e => {
                if (!grouped[e.base]) grouped[e.base] = { equipos: [], down: 0 };
                grouped[e.base].equipos.push(e);
                if (e.estado === 'DOWN') grouped[e.base].down++;
            });
            Object.keys(grouped).sort((a,b) => grouped[b].down - grouped[a].down).forEach(name => {
                const card = document.createElement('div');
                card.className = 'card ' + (grouped[name].down > 0 ? 'error' : '');
                card.innerHTML = `<div class="card-title"><span onclick="openBaseDetail('${name}')">${name}</span> <small>${grouped[name].down}🔴</small></div>`;
                grouped[name].equipos.forEach(e => {
                    const row = document.createElement('div');
                    row.className = 'equipo-row';
                    row.onclick = () => initHistory(e.ip, name, e.tipo);
                    row.innerHTML = `<span>${e.tipo}</span><span style="color:${e.estado==='UP'?'#3fb950':'#f85149'}">${e.estado}</span>`;
                    card.appendChild(row);
                });
                container.appendChild(card);
            });
        }

        function renderMenuTipos(container) {
            const counts = {};
            rawData.forEach(e => {
                if (!counts[e.tipo]) counts[e.tipo] = { total: 0, down: 0 };
                counts[e.tipo].total++; if (e.estado === 'DOWN') counts[e.tipo].down++;
            });
            Object.keys(counts).forEach(type => {
                const card = document.createElement('div');
                card.className = 'card ' + (counts[type].down > 0 ? 'error' : '');
                card.style.cursor = 'pointer';
                card.onclick = () => { currentCategory = type; render(); };
                card.innerHTML = `<div class="card-title">${type}s <small>${counts[type].down}🔴</small></div><div style="font-size:0.8em; color:#8b949e">Total: ${counts[type].total}</div>`;
                container.appendChild(card);
            });
        }

        function renderDetalleTipo(container) {
            const filtered = rawData.filter(e => e.tipo === currentCategory);
            container.innerHTML = `<div class="breadcrumb"><span onclick="currentCategory=null; render()">⬅ Categorías</span> / ${currentCategory}</div>`;
            const card = document.createElement('div');
            card.className = 'card'; card.style.width = '100%';
            filtered.forEach(e => {
                const row = document.createElement('div');
                row.className = 'equipo-row';
                row.onclick = () => initHistory(e.ip, e.base, e.tipo);
                row.innerHTML = `<span>${e.base}</span><span style="color:${e.estado==='UP'?'#3fb950':'#f85149'}">${e.estado}</span>`;
                card.appendChild(row);
            });
            container.appendChild(card);
        }

        globalTimer = setInterval(refreshGlobal, 15000);
        refreshGlobal();
    </script>
</body>
</html>
